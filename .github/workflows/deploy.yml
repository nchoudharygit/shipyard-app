name: Build and push Docker image
on:
    push:
        branches: [ main ]          # Sirf main pe push hone pe
    pull_request:
        branches: [ main ]          # PR pe bhi — test ke liye
jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2
            - name: setup aws credentials
              uses: aws-actions/configure-aws-credentials@v1
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ secrets.AWS_REGION }}
            - name: Login to Amazon ECR 
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v1
            - name: Build, tag, and push image to Amazon ECR
              env:
                ECR_REPOSITORY: ${{ secrets.ECR_REGISTRY }}
                IMAGE_TAG: ${{ github.sha }}
              run: |
                docker build -t $ECR_REPOSITORY/shipyard-app:$IMAGE_TAG .
                docker push $ECR_REPOSITORY/shipyard-app:$IMAGE_TAG
                # 'latest' tag bhi update karo
                docker tag $ECR_REPOSITORY/shipyard-app:$IMAGE_TAG $ECR_REPOSITORY/shipyard-app:latest
                docker push $ECR_REPOSITORY/shipyard-app:latest
                echo 'Pushed: '$ECR_REPOSITORY/shipyard-app:$IMAGE_TAG